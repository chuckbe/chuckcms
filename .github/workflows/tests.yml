name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        laravel: ['10.*']
        include:
          - laravel: '10.*'
            testbench: '^8.0'

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, gd, fileinfo
          coverage: none

      # Every dompdf 2.x (via barryvdh/laravel-dompdf ^2) and the Laravel 10
      # line have security advisories, and Composer >= 2.9 refuses to install
      # those by default. Test the dependency set Laravel 10 sites actually
      # get; remove this once Phase 3 moves to dompdf ^3 / Laravel 11+.
      - name: Allow packages with security advisories
        run: |
          composer config --global audit.block-insecure false || true
          composer config --global --json policy '{"advisories": {"block": false}}' || true

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
