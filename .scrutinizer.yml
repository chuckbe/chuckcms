build:
  image: default-jammy
  environment:
    php:
      version: 8.3.27
      ini:
        memory_limit: -1
  nodes:
    analysis:
      tests:
        override:
          - php-scrutinizer-run
    tests:
      tests:
        override:
          - command: vendor/bin/phpunit

filter:
  excluded_paths:
    - 'tests/*'
  dependency_paths:
    - 'vendor/'
